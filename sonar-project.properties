# SonarQube Project Configuration for AirSense
sonar.projectKey=airsense
sonar.projectName=AirSense - Real-Time Air Quality Monitoring & Alert System
sonar.projectVersion=1.0.0

sonar.sources=backend/app,worker,ml/src
sonar.tests=tests
sonar.python.version=3.11,3.12,3.15
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.exclusions=venv/**,node_modules/**,**/__pycache__/**,ml/artifacts/**
