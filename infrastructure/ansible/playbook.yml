---
- name: Configure AirSense Host and Deploy Application Stack
  hosts: airsense_servers
  become: true

  vars:
    app_directory: /opt/airsense
    compose_version: v2.24.5

  tasks:
    - name: Update apt cache and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - ufw
        state: present

    - name: Configure UFW firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "5000"
        - "3001"

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: latest

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        mode: "0755"

    - name: Copy project deployment files
      copy:
        src: "{{ item.src }}"
        dest: "{{ app_directory }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: "../../docker-compose.yml", dest: "docker-compose.yml" }
        - { src: "../../.env.example", dest: ".env" }

    - name: Launch AirSense containers via Docker Compose
      command:
        cmd: docker compose up -d --build
        chdir: "{{ app_directory }}"

    - name: Wait for backend readiness probe
      uri:
        url: "http://localhost:5000/api/v1/health/ready"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 15
      delay: 5
