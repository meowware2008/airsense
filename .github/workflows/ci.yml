name: AirSense CI Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  backend-and-ml-tests:
    name: Backend, Provider & ML Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r ml/requirements.txt
          pip install flake8

      - name: Code Linting
        run: |
          flake8 backend/ worker/ ml/src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          PROMETHEUS_ENABLED: "false"
        run: |
          pytest tests/ -v --junitxml=test-results.xml

      - name: Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Informative reporting in PR check
