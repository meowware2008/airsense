version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: airsense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-airsense}
      MYSQL_USER: ${MYSQL_USER:-airsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-airsense_secure_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - airsense-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: airsense-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-airsense_production_secret_key_change_me}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-airsense}:${MYSQL_PASSWORD:-airsense_secure_password}@mysql:3306/${MYSQL_DATABASE:-airsense}
      AQI_PROVIDER: ${AQI_PROVIDER:-open_meteo}
      AQI_API_KEY: ${AQI_API_KEY:-}
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-60}
      MODEL_PATH: /app/ml/artifacts/random_forest_pm25.joblib
      PROMETHEUS_ENABLED: "true"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - airsense-net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: airsense-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-airsense}:${MYSQL_PASSWORD:-airsense_secure_password}@mysql:3306/${MYSQL_DATABASE:-airsense}
      AQI_PROVIDER: ${AQI_PROVIDER:-open_meteo}
      AQI_API_KEY: ${AQI_API_KEY:-}
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-60}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - airsense-net

  prometheus:
    build:
      context: .
      dockerfile: monitoring/prometheus/Dockerfile
    container_name: airsense-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - airsense-net

  grafana:
    build:
      context: .
      dockerfile: monitoring/grafana/Dockerfile
    container_name: airsense-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - airsense-net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  airsense-net:
    driver: bridge
